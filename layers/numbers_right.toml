[layer]
name = "Numbers Right"
split_after_row = 3

# Row 1: 7 8 9
[[row]]
keys = [
  { label = "7", keycode = 8 },
  { label = "8", keycode = 9 },
  { label = "9", keycode = 10 }
]

# Row 2: 4 5 6
[[row]]
keys = [
  { label = "4", keycode = 5 },
  { label = "5", keycode = 6 },
  { label = "6", keycode = 7 }
]

# Row 3: 1 2 3
[[row]]
keys = [
  { label = "1", keycode = 2 },
  { label = "2", keycode = 3 },
  { label = "3", keycode = 4 }
]

# Row 4: 0 . Enter
[[row]]
keys = [
  { label = "0", keycode = 11 },
  { label = ".", keycode = 52 },
  { label = "↵", keycode = 28 }
]

# Row 5: + - Backspace
[[row]]
keys = [
  { label = "+", keycode = 13 },
  { label = "-", keycode = 12 },
  { label = "⌫", keycode = 14 }
]

# Row 6: * / =
[[row]]
keys = [
  { label = "*", keycode = 9 },
  { label = "/", keycode = 53 },
  { label = "=", keycode = 13 }
]

# Row 7: 00 (three zeros for quick entry)
[[row]]
keys = [
  { label = "0", keycode = 11 },
  { label = "0", keycode = 11 },
  { label = "0", keycode = 11 }
]

# Row 8: Space + Base layer
[[row]]
keys = [
  { label = "Space", keycode = 57, width = 2.0 },
  { label = "Base", layer_switch = { layer = "Base", activation = "Toggle" } }
]
